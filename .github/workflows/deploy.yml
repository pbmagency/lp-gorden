name: Deploy Gorden to aaPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gorden-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SERVER_IP: '187.124.141.96'
      TARGET_DIR: '/www/wwwroot/toko.gordenwallpapersolo.com'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - name: Build browser and SSR assets
        run: |
          npm ci --include=optional
          npm run build:ssr
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY_VPS3 }}
      - name: Trust verified VPS host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' '187.124.141.96 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOPn5fIkFXUfwwJSvDBQjlkevGrvt3g4UX+64k31TJb+' >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Sync application
        run: |
          rsync -az --delete \
            --exclude='/.env' \
            --exclude='/.user.ini' \
            --exclude='/.well-known/' \
            --exclude='/public/.user.ini' \
            --exclude='/public/.well-known/' \
            --exclude='/public/storage' \
            --exclude='/storage/' \
            --exclude='/bootstrap/cache/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/node_modules/' \
            ./ "root@$SERVER_IP:$TARGET_DIR/"
      - name: Finish deployment and verify HTTPS
        run: |
          ssh "root@$SERVER_IP" 'bash -se' <<'REMOTE'
          cd /www/wwwroot/toko.gordenwallpapersolo.com
          /www/server/php/84/bin/php artisan optimize:clear
          /www/server/php/84/bin/php artisan migrate --force
          test -L public/storage || ln -s ../storage/app/public public/storage
          /www/server/php/84/bin/php artisan optimize
          chown -R www:www /www/wwwroot/toko.gordenwallpapersolo.com
          chmod 640 .env
          systemctl restart toko-gorden-inertia-ssr.service
          systemctl is-active --quiet toko-gorden-inertia-ssr.service
          curl --retry 3 --retry-delay 2 --retry-all-errors -fsS --resolve toko.gordenwallpapersolo.com:443:127.0.0.1 https://toko.gordenwallpapersolo.com/ -o /dev/null
          REMOTE

