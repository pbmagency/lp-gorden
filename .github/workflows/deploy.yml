name: Deploy to CyberPanel VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # Sesuaikan jika pakai PHP 8.1 atau 8.3

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install NPM & Build Assets
        run: |
          npm install
          npm run build

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY_VPS2 }}

      - name: Add Server to Known Hosts
        run: ssh-keyscan -H 72.61.142.238 >> ~/.ssh/known_hosts

      - name: Deploy files with rsync
        run: |
          # Mengirim semua file (kecuali file git & env) ke sub2_laravel
          rsync -avz --exclude='.git' --exclude='.github' --exclude='.env' ./ root@72.61.142.238:/home/pbmagency.id/sub2_laravel/

      - name: Fix Permissions, Move Public, & Auto-Edit index.php
        run: |
          ssh root@72.61.142.238 << 'EOF'
            # 1. Pindahkan isi folder public ke etalase (sub2)
            cp -r /home/pbmagency.id/sub2_laravel/public/* /home/pbmagency.id/sub2/
            
            # 2. Auto-edit file index.php agar mengarah ke gudang sub2_laravel
            sed -i "s|__DIR__.'/../storage|__DIR__.'/../sub2_laravel/storage|g" /home/pbmagency.id/sub2/index.php
            sed -i "s|__DIR__.'/../vendor|__DIR__.'/../sub2_laravel/vendor|g" /home/pbmagency.id/sub2/index.php
            sed -i "s|__DIR__.'/../bootstrap|__DIR__.'/../sub2_laravel/bootstrap|g" /home/pbmagency.id/sub2/index.php
            
            # 3. Cari tahu siapa user/karyawan CyberPanel asli di server ini
            CYBER_USER=$(stat -c '%U' /home/pbmagency.id/public_html)
            CYBER_GROUP=$(stat -c '%G' /home/pbmagency.id/public_html)
            
            # 4. Copot gembok root! Ubah kepemilikan menjadi milik CyberPanel
            chown -R $CYBER_USER:$CYBER_GROUP /home/pbmagency.id/sub2_laravel
            chown -R $CYBER_USER:$CYBER_GROUP /home/pbmagency.id/sub2
            
            # 5. Beri izin jalan untuk folder cache & storage Laravel
            chmod -R 775 /home/pbmagency.id/sub2_laravel/storage
            chmod -R 775 /home/pbmagency.id/sub2_laravel/bootstrap/cache
          EOF