name: Deploy to CyberPanel VPS1 (Toko)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # Sesuaikan kalau lu pake versi lain

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install NPM & Build Assets
        run: |
          npm install
          npm run build

      - name: Setup SSH Key (Jalur Elit VPS1)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY_VPS1 }}

      - name: Add Server to Known Hosts
        run: ssh-keyscan -H 72.61.210.213 >> ~/.ssh/known_hosts

      - name: Deploy files with rsync
        run: |
          # Mengirim semua file (kecuali git & env) ke gudang toko_laravel
          rsync -avz --exclude='.git' --exclude='.github' --exclude='.env' ./ root@72.61.210.213:/home/toko.gordenwallpapersolo.com/toko_laravel/

      - name: Fix Permissions, Move Public, & Auto-Edit index.php
        run: |
          ssh root@72.61.210.213 << 'EOF'
            # 1. Bikin folder gudang kalau belum ada
            mkdir -p /home/toko.gordenwallpapersolo.com/toko_laravel
            
            # 2. Pindahkan isi folder public ke etalase utama (public_html)
            cp -r /home/toko.gordenwallpapersolo.com/toko_laravel/public/* /home/toko.gordenwallpapersolo.com/public_html/
            
            # 3. Auto-edit file index.php agar mengarah ke gudang toko_laravel
            sed -i "s|__DIR__.'/../storage|__DIR__.'/../toko_laravel/storage|g" /home/toko.gordenwallpapersolo.com/public_html/index.php
            sed -i "s|__DIR__.'/../vendor|__DIR__.'/../toko_laravel/vendor|g" /home/toko.gordenwallpapersolo.com/public_html/index.php
            sed -i "s|__DIR__.'/../bootstrap|__DIR__.'/../toko_laravel/bootstrap|g" /home/toko.gordenwallpapersolo.com/public_html/index.php
            
            # 4. Cari tahu siapa user/karyawan CyberPanel asli di server ini
            CYBER_USER=$(stat -c '%U' /home/toko.gordenwallpapersolo.com/public_html)
            CYBER_GROUP=$(stat -c '%G' /home/toko.gordenwallpapersolo.com/public_html)
            
            # 5. Copot gembok root! Ubah kepemilikan menjadi milik CyberPanel
            chown -R $CYBER_USER:$CYBER_GROUP /home/toko.gordenwallpapersolo.com/toko_laravel
            chown -R $CYBER_USER:$CYBER_GROUP /home/toko.gordenwallpapersolo.com/public_html
            
            # 6. Beri izin jalan untuk folder cache & storage Laravel
            chmod -R 775 /home/toko.gordenwallpapersolo.com/toko_laravel/storage
            chmod -R 775 /home/toko.gordenwallpapersolo.com/toko_laravel/bootstrap/cache
          EOF