name: Deploy to VPS 2 (Staging)

on:
  push:
    branches:
      - main # Ubah ke nama branch-mu jika pakai branch lain

env:
  SERVER_IP: '72.61.142.238'
  SERVER_USER: 'root'
  DOMAIN_USERNAME: 'pbmagency'
  TARGET_DIR_LARAVEL: '/home/pbmagency.id/sub2_laravel'
  TARGET_DIR_PUBLIC: '/home/pbmagency.id/sub2'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install Dependencies (Composer)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js & Build Assets
        run: |
          npm install
          npm run build

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY_VPS2 }}

      - name: Add Server to Known Hosts
        run: ssh-keyscan -H ${{ env.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy Core Laravel Files
        run: |
          rsync -avz --no-perms --no-owner --no-group --delete \
          --exclude='.git' \
          --exclude='/public' \
          --exclude='.env' \
          ./ ${{ env.SERVER_USER }}@${{ env.SERVER_IP }}:${{ env.TARGET_DIR_LARAVEL }}/

      - name: Deploy Public Files
        run: |
          rsync -avz --no-perms --no-owner --no-group --delete \
          ./public/ ${{ env.SERVER_USER }}@${{ env.SERVER_IP }}:${{ env.TARGET_DIR_PUBLIC }}/

      - name: Adjust Permissions & Clear Cache
        run: |
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_IP }} "
            chown -R ${{ env.DOMAIN_USERNAME }}:${{ env.DOMAIN_USERNAME }} ${{ env.TARGET_DIR_LARAVEL }}
            chown -R ${{ env.DOMAIN_USERNAME }}:${{ env.DOMAIN_USERNAME }} ${{ env.TARGET_DIR_PUBLIC }}
            
            cd ${{ env.TARGET_DIR_LARAVEL }}
            php artisan optimize:clear
          "